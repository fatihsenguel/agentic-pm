[data_fetch]
# Intervalle in Tagen, wie oft wir versuchen sollen, diese Daten abzurufen.
earnings_fetch_interval_days = 7
profile_fetch_interval_days  = 30
shares_fetch_interval_days   = 30
# Kurse und Wechselkurse: wie oft der Cache den Provider erneut fragt,
# wenn der Zeitraum schon einmal abgefragt wurde.
price_fetch_interval_days    = 1

# EDGAR: Intervalle und Ratenlimit gehören hierher, die Kontaktangabe nicht.
# Diese Datei ist versioniert und das Repository ist öffentlich, also hält sie
# Policy und keine Identität; die Kontaktangabe steht in .env neben den
# Schlüsseln. Das Ratenlimit kommt mit dem Leser, der es liest.
filings_fetch_interval_days  = 7
