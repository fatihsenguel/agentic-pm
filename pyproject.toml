[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-finance"
version = "0.1.0"
description = "Multi-agent financial analysis"
requires-python = ">=3.10,<3.11"

dependencies = [
    "sqlalchemy>=2.0", "alembic", "pandas>=2.0", "numpy", "scipy", "yfinance",
    "langchain-core", "langchain-anthropic", "langchain-openai", "langgraph",
    "pydantic>=2", "python-dotenv", "tomli", "requests",
    "beautifulsoup4", "rich", "fastapi", "uvicorn",
]

[project.optional-dependencies]
rag = ["sentence-transformers", "pypdf", "PyPDF2", "pdfplumber", "PyMuPDF"]
dev = ["pytest>=7.4", "pytest-asyncio", "black>=23"]

[tool.setuptools]
py-modules = ["config"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"