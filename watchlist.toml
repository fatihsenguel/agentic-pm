# The watchlist and the prediction ledger as config, derived from
# docs/WATCHLIST.md.
#
# One [[candidate]] per watchlist entry, in document order; its predictions
# are [[candidate.prediction]] rows under it, so a prediction without a
# thesis cannot be written. `thesis` and each `statement` are the document's
# words verbatim. Money figures are in the candidate's reporting currency;
# margins are fractions, 87% written 0.87. `period` names the fiscal year the
# figure is reported for. A `figure` prediction is scored by one comparison
# of the reported figure against `bound` and `value`; an `event` prediction
# by an outcome entered with its source. Score fields (outcome, source,
# scored_on, result) are absent until the date comes and then all four are
# written; result is right or wrong.
#
# A [candidate.valuation] table states the free cash flow growth I assume
# for the candidate, a low and a high, as fractions (Part 11 D38); a
# candidate without one has no range until it states them.
#
# `asset_class`, `sector` and `instrument_type` are the document's
# Classification line, the three things the IPS check reads about the
# instrument itself: the band of section 3 the position falls in, the count
# IPS-4.3 limits, and whether IPS-4.2 attributes it to an issuer at all.
# Every candidate states all three, and a candidate missing one is not
# checked (docs/WATCHLIST.md). The words are mine, not a data provider's; a
# word the IPS has no band for stops the check that reads it, not this file.
#
# No metric here depends on the price (DIRECTION.md invariant 7).
# portfolio_tool/watchlist.py reads the candidates and their growth pairs;
# the prediction rows are read by nothing yet (case 4.5).
# tests/test_watchlist.py holds this file to the document.

[[candidate]]
id = "W-1"
ticker = "GOOGL"
name = "Alphabet"
currency = "USD"
asset_class = "Equity"
sector = "Communication Services"
instrument_type = "share"
added_on = 2026-09-10
status = "active"
thesis = """Search and YouTube are the advertising businesses that keep growing through every cycle, the cloud segment is now profitable and taking share, and the company funds its own capital spending from operating cash flow with no debt to speak of. The thesis is that the advertising businesses keep their margins while the cloud segment's margin catches up, and that the capital spending on data centres shows in cloud revenue rather than in lasting margin damage."""

[candidate.entry_condition]
kind = "valuation"
clause = "PHI-4.1"

[candidate.valuation]
growth_low = 0.06
growth_high = 0.12

[[candidate.prediction]]
id = "W-1.1"
made_on = 2026-09-10
due = 2027-03-01
kind = "figure"
metric = "revenue"
bound = "min"
value = 420000000000
period = "FY2026"
statement = """By 1 March 2027 Alphabet will have reported revenue for fiscal 2026 of at least 420 billion dollars."""

[[candidate.prediction]]
id = "W-1.2"
made_on = 2026-09-10
due = 2027-03-01
kind = "event"
statement = """By 1 March 2027 Alphabet's annual report for fiscal 2026 will show the cloud segment profitable at the operating level for the full year."""

